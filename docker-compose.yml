# Run the whole stack locally with one command:  docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: applywise
      POSTGRES_PASSWORD: applywise
      POSTGRES_DB: applywise
    volumes:
      - db-data:/var/lib/postgresql/data # keep data between restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applywise"]
      interval: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://applywise:applywise@db:5432/applywise # "db" = the service name above
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-please-123456}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy # wait until Postgres is ready
    ports:
      - "4000:4000"

  client:
    build: ./client
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  db-data:
