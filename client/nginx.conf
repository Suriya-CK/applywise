server {
  listen 80;
  root /usr/share/nginx/html;

  # Forward API calls to the Node.js container (named "server" in docker-compose).
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Single-page app: unknown paths (e.g. /match) return index.html and React Router takes over.
  location / {
    try_files $uri /index.html;
  }
}
